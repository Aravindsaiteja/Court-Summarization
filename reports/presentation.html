      objectiveBox.textContent = data.objective;
      scriptBox.textContent = `"${data.script}"`;
      vivaBox.textContent = data.viva;
    }

    prevBtn.addEventListener('click', () => { if (currentSlide > 0) renderSlide(currentSlide - 1); });

      if (e.key === 'ArrowRight' || e.key === ' ') {
        if (currentSlide < slidesData.length - 1) renderSlide(currentSlide + 1);

        if (currentSlide > 0) renderSlide(currentSlide - 1);
      }
