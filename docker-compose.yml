version: '3.8'

services:
  court-api:
    build: .
    container_name: court_summarizer_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./configs:/app/configs
    environment:
      - ASR_MODEL_SIZE=tiny
      - DEFAULT_SUMMARIZER=textrank
    restart: unless-stopped
    command: ["uvicorn", "src.api.server:app", "--host", "0.0.0.0", "--port", "8000"]

  court-ui:
    build: .
    container_name: court_summarizer_ui
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./Dataset:/app/Dataset
    environment:
      - STREAMLIT_SERVER_PORT=8501
    restart: unless-stopped
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
